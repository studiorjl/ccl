<h1>Contact</h1>
<p>For all property development enquiries please fill out the form below.</p>
<form class="contact-form" action="https://formsubmit.co/admin@ccldevelopment.com.au" method="POST">
<input type="hidden" name="_subject" value="New property development enquiry | CCL Development">

<button class="contact-submit" type="submit">Submit</button>
</form>
